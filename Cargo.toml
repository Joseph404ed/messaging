[package]
name = "messaging"
version = "0.1.0"
edition = "2021"
authors = ["rustyai <devrustyai@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Communication protocols, message routing, and ACL for multi-agent systems"
repository = "https://github.com/rustyai/messaging"
documentation = "https://docs.rs/messaging"
keywords = ["agents", "messaging", "acl", "communication"]
categories = ["concurrency", "network-programming"]
readme = "README.md"

[dependencies]
agent-core = { path = "../agent-core" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"